[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gopniya"
version = "0.1.0"
description = "De-identify Indian clinical notes (English + Hindi) before they reach a cloud LLM, then restore values in the answer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gopniya = "gopniya.__main__:main"

[tool.setuptools]
packages = ["gopniya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
